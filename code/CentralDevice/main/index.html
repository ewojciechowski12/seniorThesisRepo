<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip-Up Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.5em;
    }

    .status {
      font-size: 2em;
      font-weight: bold;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
    }

    .tripped {
      background-color: #7f1d1d;
      color: #fecaca;
    }

    .set {
      background-color: #14532d;
      color: #bbf7d0;
    }

    .timestamp {
      margin-top: 15px;
      font-size: 0.9em;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Tip-Up Node #1</h1>
    <div class="status set" id="statusBox">SET</div>>    
    <div class="timestamp" id="timestamp">Last update: just now</div>
    <button id="resetBtn" onclick="resetAlert()">Reset Alert</button>
  </div>

  <script>
    async function fetchStatus(){
      try{
        const res = await fetch('/status');
        const data = await res.json();
        const statusBox = document.getElementById('statusBox');
        const btn = document.getElementById('resetBtn');
        const ts = document.getElementById('timestamp');

        statusBox.className = 'status ' + data.status;
        statusBox.textContent = data.status.toUpperCase();
        ts.textContent = 'Last update: ' + data.timestamp;
        btn.style.display = data.status === 'tripped' ? 'block' : 'none';
        ts.textContent = 'Last update: ' + data.timestamp;
      }catch(e){
        console.error('Poll failed:', e);
      }
    }

    async function resetAlert(){
      await fetch('reset', { method: 'POST' });
      fetchStatus();
    }

    setInterval(fetchStatus, 5000);
    fetchStatus();
  </script>

</body>
</html>
